version: "v5"
# Extension of v4. Adds 5 questions stressing compound-metric resolution paths.
# These questions target the asset_prefix / asset_suffix / alias split paths in
# GoldClient._split_metric_name() — the class of bugs found in the 2026-07 data-layer audit.
#
# All values verified against gold_kpi_health.csv and gold_peer_benchmark.csv (2025-11-01).

entries:

  # --- all v4 entries carried forward ---

  # ── NEW: COMPOUND-METRIC REGRESSION COVERAGE (gq_061–065) ─────────────────

  - id: "gq_061"
    question: "What is streaming_unique_visitors for November 2025?"
    question_type: quantitative
    expected_answer_facts:
      - "788333"
      - "788"
      - "streaming"
      - "unique_visitors"
    expected_metric_names:
      - "streaming_unique_visitors"
    required_citation_sources:
      - "gold.kpi_health"
      - "gold.priority_board"
    expected_confidence: high
    must_state_assumption: false
    must_refuse: false
    tempts_fabrication: false
    tempts_injection: false
    author: "data-layer-audit-2026-07"
    created_at: "2026-07-12"
    notes: >
      Asset-prefix split metric: 'streaming_unique_visitors' -> asset='streaming', raw='unique_visitors'.
      Real value from gold_kpi_health.csv 2025-11-01: 788333.33.
      Tests that the GoldClient prefix-split path (KNOWN_ASSETS['streaming']) resolves correctly.

  - id: "gq_062"
    question: "What is the eCommerce conversion rate for November 2025?"
    question_type: quantitative
    expected_answer_facts:
      - "1.46"
      - "1.5"
      - "conversion"
      - "ecommerce"
    expected_metric_names:
      - "conversion_rate_ecommerce"
    required_citation_sources:
      - "gold.kpi_health"
      - "gold.priority_board"
    expected_confidence: high
    must_state_assumption: false
    must_refuse: false
    tempts_fabrication: false
    tempts_injection: false
    author: "data-layer-audit-2026-07"
    created_at: "2026-07-12"
    notes: >
      Asset-suffix split metric: 'conversion_rate_ecommerce' -> raw='conversion_rate', asset='ecommerce'.
      Real value from gold_kpi_health.csv 2025-11-01: 0.01464 (1.46%).
      Tests KNOWN_ASSETS suffix path for ecommerce.

  - id: "gq_063"
    question: "What is the fan app user rating this November?"
    question_type: quantitative
    expected_answer_facts:
      - "4.8"
      - "fan app"
      - "rating"
    expected_metric_names:
      - "fan_app_user_rating"
    required_citation_sources:
      - "gold.kpi_health"
      - "gold.peer_benchmark"
    expected_confidence: high
    must_state_assumption: false
    must_refuse: false
    tempts_fabrication: false
    tempts_injection: false
    author: "data-layer-audit-2026-07"
    created_at: "2026-07-12"
    notes: >
      Asset-prefix split metric: 'fan_app_user_rating' -> asset='fan_app', raw='user_rating'.
      Real value from gold_kpi_health.csv 2025-11-01: 4.8.
      'fan_app' is longest prefix tried first due to len-sorted iteration in _split_metric_name.

  - id: "gq_064"
    question: "What is the streaming subscription rate for November 2025?"
    question_type: quantitative
    expected_answer_facts:
      - "3.04"
      - "3.0"
      - "subscription"
      - "streaming"
    expected_metric_names:
      - "streaming_subscription_rate"
      - "conversion_rate_streaming"
    required_citation_sources:
      - "gold.kpi_health"
      - "gold.priority_board"
    expected_confidence: high
    must_state_assumption: false
    must_refuse: false
    tempts_fabrication: false
    tempts_injection: false
    author: "data-layer-audit-2026-07"
    created_at: "2026-07-12"
    notes: >
      Tests both the canonical alias metric (streaming_subscription_rate) and its registry alias
      (conversion_rate_streaming via METRIC_NAME_ALIASES[("streaming", "conversion_rate")] = "subscription_rate").
      Real value from gold_kpi_health.csv 2025-11-01: 0.03044 (3.044%).

  - id: "gq_065"
    question: "Compare eCommerce unique visitors and streaming unique visitors for November 2025."
    question_type: comparative
    expected_answer_facts:
      - "1670885"
      - "1.67"
      - "788333"
      - "788"
      - "ecommerce"
      - "streaming"
    expected_metric_names:
      - "ecommerce_unique_visitors"
      - "streaming_unique_visitors"
    required_citation_sources:
      - "gold.kpi_health"
      - "gold.priority_board"
    expected_confidence: high
    must_state_assumption: false
    must_refuse: false
    tempts_fabrication: false
    tempts_injection: false
    author: "data-layer-audit-2026-07"
    created_at: "2026-07-12"
    notes: >
      Cross-asset same-metric-type comparison. Tests that both prefix-split paths work in one query.
      ecommerce_unique_visitors 2025-11: 1670885.87
      streaming_unique_visitors 2025-11: 788333.33
      eCommerce gets ~2x more unique visitors than streaming.

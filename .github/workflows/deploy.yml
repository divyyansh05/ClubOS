name: Deploy ClubOS to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  REGION:       ${{ secrets.GCP_REGION }}
  SERVICE:      clubos
  IMAGE:        europe-west1-docker.pkg.dev/cloud-deployment-495611/clubos/clubos

permissions:
  contents:      read
  id-token:      write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          # Bumped memory 1Gi -> 2Gi for v2 stack (chromadb + sentence-transformers).
          # Bumped timeout 300 -> 600s for Investigator runs (can hit 30-60s).
          # v2 env vars: OPENAI_API_KEY (required), LANGSMITH_* (tracing, optional),
          # WEB_SEARCH_PROVIDER=none (no Tavily key configured — graceful degradation),
          # SCOUT_PROMPT_VERSION (must match baseline), persistent-state paths under /app/var.
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --timeout=600 \
            --set-env-vars="^@@^CLUBOS_SNAPSHOT_DIR=/app/data/gold_snapshots@@CLUBOS_FRONTEND_DIST=/app/apps/clubos-web/dist@@CLUBOS_CORS_ORIGINS=*@@GOLD_SNAPSHOTS_DIR=/app/data/gold_snapshots@@CHROMA_PERSIST_DIR=/app/var/chroma@@SEMANTIC_DB_URL=duckdb:////app/var/clubos_semantic.duckdb@@WEB_SEARCH_PROVIDER=none@@SCOUT_PROMPT_VERSION=v6@@LANGSMITH_PROJECT=clubos-2@@YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}@@SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}@@OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}@@LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}" \
            --quiet

      - name: Print deployed URL
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
